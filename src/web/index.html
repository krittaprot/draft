<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easel</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <div class="group">
      <button id="docs-btn" class="icon-btn" title="Documents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <input id="doc-name" spellcheck="false" aria-label="Document name">
    </div>
    <div class="group tools" role="toolbar" aria-label="Tools">
      <button data-tool="select" title="Select (V)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
      <button data-tool="hand" title="Hand (H, or hold Space)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V6a2 2 0 0 1 4 0v5m0-6a2 2 0 0 1 4 0v6m0-4a2 2 0 0 1 4 0v7a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3-2l2 2"/></svg></button>
      <span class="sep"></span>
      <button data-tool="frame" title="Frame (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v18M16 3v18M3 8h18M3 16h18"/></svg></button>
      <button data-tool="rect" title="Rectangle (R)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (O)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></button>
      <button data-tool="text" title="Text (T)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <span class="sep"></span>
      <button data-tool="comment" title="Comment (C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    </div>
    <div class="group">
      <span id="live" class="live" title="Live updates"><span class="dot"></span><span id="live-text">Live</span></span>
      <button id="share-btn" class="btn">Share</button>
      <button id="connect-btn" class="btn primary">Connect agent</button>
      <button id="zoom-btn" class="btn ghost" title="Zoom to fit (Shift+1)">100%</button>
    </div>
  </header>

  <aside id="left">
    <section>
      <div class="section-head"><span>Pages</span><button id="add-page" class="icon-btn small" title="Add page">+</button></div>
      <ul id="pages" class="list"></ul>
    </section>
    <section class="grow">
      <div class="section-head"><span>Layers</span></div>
      <ul id="layers" class="list tree"></ul>
    </section>
  </aside>

  <main id="canvas-wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg">
      <g id="world"></g>
      <g id="overlay"></g>
    </svg>
    <div id="banner" hidden></div>
    <div id="toasts"></div>
    <form id="comment-pop" hidden>
      <textarea placeholder="Add a comment for people and agents…" rows="3" required></textarea>
      <div class="row"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">Comment</button></div>
    </form>
    <div id="empty" hidden>
      <h2>Empty canvas</h2>
      <p>Draw with the toolbar, or connect an agent and ask it to design something.</p>
    </div>
  </main>

  <aside id="right">
    <nav id="tabs">
      <button data-tab="design" class="active">Design</button>
      <button data-tab="comments">Comments <span id="comment-count"></span></button>
      <button data-tab="history">History</button>
    </nav>
    <div id="panel"></div>
  </aside>

  <dialog id="docs-dialog">
    <div class="dialog-head"><h2>Documents</h2><button class="icon-btn" data-close>✕</button></div>
    <form id="new-doc" class="row"><input name="name" placeholder="New document name" required><button class="btn primary">Create</button></form>
    <ul id="doc-list" class="doc-list"></ul>
  </dialog>

  <dialog id="connect-dialog">
    <div class="dialog-head"><h2>Connect an agent</h2><button class="icon-btn" data-close>✕</button></div>
    <div id="connect-body"></div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
